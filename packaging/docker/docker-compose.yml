services:
  impulse:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
    image: impulse:packaging
    user: "0"
    container_name: impulse-packaging
    command: ["--config", "/etc/impulse/config.yaml"]
    volumes:
      - ./config.docker.yaml:/etc/impulse/config.yaml:ro
      - ../../certs:/etc/impulse/certs:ro
    ports:
      - "9889:9889/udp"
      - "9889:9889/tcp"
      - "9901:9901/tcp"
      - "9902:9902/tcp"
    restart: unless-stopped
