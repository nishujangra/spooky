version: 1

listen:
  protocol: http3
  address: "0.0.0.0"
  port: 9889
  tls:
    cert: "/etc/impulse/certs/fullchain.pem"
    key: "/etc/impulse/certs/privkey.pem"

upstream_tls:
  verify_certificates: true
  strict_sni: true

upstream:
  default:
    load_balancing:
      type: round-robin
    route:
      path_prefix: "/"
    backends:
      - id: "backend1"
        address: "backend.internal.example:8443"
        weight: 100
        health_check:
          path: "/health"
          interval: 5000
          timeout_ms: 1000
          failure_threshold: 3
          success_threshold: 2
          cooldown_ms: 5000

log:
  level: info
  format: json
  file:
    enabled: true
    path: /var/log/impulse/impulse.log

security:
  privileges:
    enabled: true
    user: "impulse"
    group: "impulse"

observability:
  metrics:
    enabled: true
    required: false
    address: "127.0.0.1"
    port: 9901
    path: "/metrics"
  control_api:
    # Disabled by default: the control API exposes runtime mutation and restart,
    # so it must not come up on a fresh install with a placeholder credential.
    # To enable it, set a real token below (openssl rand -hex 32) and flip
    # enabled to true. Prefer auth.bearer_tokens over the legacy auth_token
    # field — the latter maps to a single admin-scoped identity with no RBAC.
    enabled: false
    required: false
    address: "127.0.0.1"
    port: 9902
    health_path: "/health"
    ready_path: "/ready"
    # auth:
    #   bearer_tokens:
    #     - token: "GENERATE-ME"
    #       role: admin
    #       actor_id: "platform-admin"
    # ip_allowlist:
    #   cidrs: ["127.0.0.0/8", "::1/128"]
