version: 1

listen:
  protocol: http3
  address: "0.0.0.0"
  port: 9889
  tls:
    cert: "/etc/impulse/certs/fullchain.pem"
    key: "/etc/impulse/certs/privkey.pem"

# listeners: optional multi-listener block; overrides the top-level listen block when set.
# Use this to bind multiple independent listeners with separate TLS identities.
# listeners:
#   - protocol: http3
#     address: "0.0.0.0"
#     port: 9889
#     tls:
#       cert: "/etc/impulse/certs/public-fullchain.pem"
#       key: "/etc/impulse/certs/public-privkey.pem"
#   - protocol: http3
#     address: "10.0.0.1"
#     port: 9890
#     tls:
#       cert: "/etc/impulse/certs/internal-fullchain.pem"
#       key: "/etc/impulse/certs/internal-privkey.pem"

# secrets: file-backed secret provider used by *_ref fields below (JWT secret_ref,
# OIDC client_secret_ref, control-plane auth_token_ref, upstream mTLS cert/key refs).
# Prefer *_ref fields over plaintext in production; plaintext siblings remain
# supported for compatibility but are considered lower-assurance.
secrets:
  default_provider: local_filesystem
  providers:
    local_filesystem:
      kind: file
      base_dir: "/etc/impulse/secrets"

upstream_tls:
  verify_certificates: true
  strict_sni: true

upstream:
  default:
    load_balancing:
      type: round-robin
    route:
      path_prefix: "/"
    host_policy:
      mode: pass-through   # pass-through | rewrite | upstream
      # host: "origin.example.com"  # required when mode: rewrite
    forwarded_headers:
      mode: append         # append | preserve | overwrite
    # tls: optional per-upstream mTLS; enable if this backend requires client certs.
    # tls:
    #   verify_certificates: true
    #   strict_sni: true
    #   client_certificate_ref:
    #     ref: "file:///etc/impulse/secrets/upstream/default-client.crt"
    #   client_key_ref:
    #     ref: "file:///etc/impulse/secrets/upstream/default-client.key"
    backends:
      - id: "backend1"
        address: "backend.internal.example:8443" # verified HTTPS by default (no scheme needed)
        weight: 100
        health_check:
          path: "/health"
          interval: 5000
          timeout_ms: 1000
          failure_threshold: 3
          success_threshold: 2
          cooldown_ms: 5000

log:
  level: info
  format: json

observability:
  control_api:
    enabled: true
    required: true
    address: "127.0.0.1"
    port: 9890
    # Recommended production posture: mTLS required plus explicit operator/admin identities.
    tls:
      client_auth:
        mode: required
        ca_file: "/etc/impulse/pki/admin-ca.pem"
    auth:
      # Prefer file-backed refs over inline bearer tokens in production.
      # bearer_tokens:
      #   - token_ref:
      #       ref: "file:///etc/impulse/secrets/control-api/operator-token"
      #     role: operator
      #     actor_id: "ops-automation"
      bearer_tokens:
        - token: "replace-with-operator-token"
          role: operator
          actor_id: "ops-automation"
        - token: "replace-with-admin-token"
          role: admin
          actor_id: "platform-admin"
      identity_source:
        kind: "mtls_subject_cn"
        role_attribute: "OU"
    authorization:
      protect_health: true
      protect_ready: true
      runtime_read_role: viewer
      runtime_mutate_role: operator
      restart_role: admin
    ip_allowlist:
      cidrs:
        - "10.0.10.0/24"
      trust_proxy_headers: false
    audit:
      enabled: true
      format: json
      sink: log

security:
  privileges:
    enabled: true
    user: "impulse"
    group: "impulse"
