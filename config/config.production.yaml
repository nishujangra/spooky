version: 1

listen:
  protocol: http3
  address: "0.0.0.0"
  port: 9889
  tls:
    cert: "/etc/spooky/certs/fullchain.pem"
    key: "/etc/spooky/certs/privkey.pem"

# listeners: optional multi-listener block; overrides the top-level listen block when set.
# Use this to bind multiple independent listeners with separate TLS identities.
# listeners:
#   - protocol: http3
#     address: "0.0.0.0"
#     port: 9889
#     tls:
#       cert: "/etc/spooky/certs/public-fullchain.pem"
#       key: "/etc/spooky/certs/public-privkey.pem"
#   - protocol: http3
#     address: "10.0.0.1"
#     port: 9890
#     tls:
#       cert: "/etc/spooky/certs/internal-fullchain.pem"
#       key: "/etc/spooky/certs/internal-privkey.pem"

upstream_tls:
  verify_certificates: true
  strict_sni: true

upstream:
  default:
    load_balancing:
      type: round-robin
    route:
      path_prefix: "/"
    host_policy:
      mode: pass-through   # pass-through | rewrite | upstream
      # host: "origin.example.com"  # required when mode: rewrite
    forwarded_headers:
      mode: append         # append | preserve | overwrite
    backends:
      - id: "backend1"
        address: "backend.internal.example:8443" # verified HTTPS by default (no scheme needed)
        weight: 100
        health_check:
          path: "/health"
          interval: 5000
          timeout_ms: 1000
          failure_threshold: 3
          success_threshold: 2
          cooldown_ms: 5000

log:
  level: info
  format: json

observability:
  control_api:
    enabled: true
    required: true
    address: "127.0.0.1"
    port: 9890
    # Recommended production posture: mTLS required plus explicit operator/admin identities.
    tls:
      client_auth:
        mode: required
        ca_file: "/etc/spooky/pki/admin-ca.pem"
    auth:
      bearer_tokens:
        - token: "replace-with-operator-token"
          role: operator
          actor_id: "ops-automation"
        - token: "replace-with-admin-token"
          role: admin
          actor_id: "platform-admin"
      identity_source:
        kind: "mtls_subject_cn"
        role_attribute: "OU"
    authorization:
      protect_health: true
      protect_ready: true
      runtime_read_role: viewer
      runtime_mutate_role: operator
      restart_role: admin
    ip_allowlist:
      cidrs:
        - "10.0.10.0/24"
      trust_proxy_headers: false
    audit:
      enabled: true
      format: json
      sink: log

security:
  privileges:
    enabled: true
    user: "spooky"
    group: "spooky"
