groups:
  - name: impulse-golden-signals
    interval: 30s
    rules:
      # Preserve external scrape labels while collapsing only the noisy
      # request-outcome dimensions. These rules are intended to be the stable
      # dashboard layer for traffic, latency, and operator failure signals.
      - record: impulse:requests:rate5m
        expr: >-
          sum without (upstream, status_class, outcome)
          (rate(impulse_upstream_requests_total[5m]))

      - record: impulse:requests_by_upstream:rate5m
        expr: >-
          sum without (status_class, outcome)
          (rate(impulse_upstream_requests_total[5m]))

      - record: impulse:requests_by_upstream_outcome:rate5m
        expr: >-
          sum without (status_class)
          (rate(impulse_upstream_requests_total[5m]))

      - record: impulse:requests_by_status_class:rate5m
        expr: >-
          sum without (upstream, outcome)
          (rate(impulse_upstream_requests_total[5m]))

      - record: impulse:request_server_errors:rate5m
        expr: >-
          sum without (upstream, status_class, outcome)
          (rate(impulse_upstream_requests_total{status_class="5xx"}[5m]))

      - record: impulse:request_server_errors_by_upstream:rate5m
        expr: >-
          sum without (status_class, outcome)
          (rate(impulse_upstream_requests_total{status_class="5xx"}[5m]))

      - record: impulse:request_server_error_ratio:rate5m
        expr: >-
          impulse:request_server_errors:rate5m
          / clamp_min(impulse:requests:rate5m, 0.000001)

      - record: impulse:request_server_error_ratio_by_upstream:rate5m
        expr: >-
          impulse:request_server_errors_by_upstream:rate5m
          / clamp_min(impulse:requests_by_upstream:rate5m, 0.000001)

      - record: impulse:requests_by_upstream_success_ratio:rate5m
        expr: >-
          (
            impulse:requests_by_upstream:rate5m
            - impulse:request_server_errors_by_upstream:rate5m
          )
          / clamp_min(impulse:requests_by_upstream:rate5m, 0.000001)

      - record: impulse:request_latency_ms:p50_5m
        expr: >-
          histogram_quantile(
            0.50,
            sum without (upstream, outcome)
            (rate(impulse_upstream_request_latency_ms_bucket{outcome="success"}[5m]))
          )

      - record: impulse:request_latency_ms:p95_5m
        expr: >-
          histogram_quantile(
            0.95,
            sum without (upstream, outcome)
            (rate(impulse_upstream_request_latency_ms_bucket{outcome="success"}[5m]))
          )

      - record: impulse:request_latency_ms:p99_5m
        expr: >-
          histogram_quantile(
            0.99,
            sum without (upstream, outcome)
            (rate(impulse_upstream_request_latency_ms_bucket{outcome="success"}[5m]))
          )

      - record: impulse:request_latency_ms_by_upstream:p50_5m
        expr: >-
          histogram_quantile(
            0.50,
            sum without (outcome)
            (rate(impulse_upstream_request_latency_ms_bucket{outcome="success"}[5m]))
          )

      - record: impulse:request_latency_ms_by_upstream:p95_5m
        expr: >-
          histogram_quantile(
            0.95,
            sum without (outcome)
            (rate(impulse_upstream_request_latency_ms_bucket{outcome="success"}[5m]))
          )

      - record: impulse:request_latency_ms_by_upstream:p99_5m
        expr: >-
          histogram_quantile(
            0.99,
            sum without (outcome)
            (rate(impulse_upstream_request_latency_ms_bucket{outcome="success"}[5m]))
          )

      - record: impulse:overload_shed:rate5m
        expr: >-
          sum without (reason)
          (rate(impulse_overload_shed_by_reason_total[5m]))

      - record: impulse:overload_shed_by_reason:rate5m
        expr: >-
          rate(impulse_overload_shed_by_reason_total[5m])

      - record: impulse:inflight_wait_admit_by_scope:rate5m
        expr: >-
          rate(impulse_inflight_wait_admit_total[5m])

      - record: impulse:overload_shed_ratio:rate5m
        expr: >-
          impulse:overload_shed:rate5m
          / clamp_min(impulse:requests:rate5m, 0.000001)

      - record: impulse:backend_timeouts:rate5m
        expr: >-
          rate(impulse_backend_timeouts[5m])

      - record: impulse:backend_errors:rate5m
        expr: >-
          rate(impulse_backend_errors[5m])

      - record: impulse:backend_timeout_ratio:rate5m
        expr: >-
          impulse:backend_timeouts:rate5m
          / clamp_min(impulse:requests:rate5m, 0.000001)

      - record: impulse:backend_error_ratio:rate5m
        expr: >-
          impulse:backend_errors:rate5m
          / clamp_min(impulse:requests:rate5m, 0.000001)

      - record: impulse:backend_failure_pressure:rate5m
        expr: >-
          impulse:backend_timeouts:rate5m
          + impulse:backend_errors:rate5m

      - record: impulse:backend_errors_by_upstream_backend:rate5m
        expr: >-
          sum without (status_class, outcome)
          (
            rate(
              impulse_backend_requests_total{
                outcome=~"failure|timeout|backend_error"
              }[5m]
            )
          )

      - record: impulse:health_checks_total:rate5m
        expr: >-
          rate(impulse_health_checks_total[5m])

      - record: impulse:health_checks_success:rate5m
        expr: >-
          rate(impulse_health_checks_success[5m])

      - record: impulse:health_checks_failure:rate5m
        expr: >-
          rate(impulse_health_checks_failure[5m])

      - record: impulse:health_check_failure_ratio:rate5m
        expr: >-
          impulse:health_checks_failure:rate5m
          / clamp_min(impulse:health_checks_total:rate5m, 0.000001)

      - record: impulse:health_failures_by_reason:rate5m
        expr: >-
          rate(impulse_health_failures_total[5m])

      - record: impulse:retry_attempts:rate5m
        expr: >-
          sum without (reason)
          (rate(impulse_retry_attempts_total[5m]))

      - record: impulse:retry_attempts_by_reason:rate5m
        expr: >-
          rate(impulse_retry_attempts_total[5m])

      - record: impulse:retry_denied_by_reason:rate5m
        expr: >-
          rate(impulse_retry_denied_total[5m])

      - record: impulse:retry_denials:rate5m
        expr: >-
          sum without (reason)
          (rate(impulse_retry_denied_total[5m]))

      - record: impulse:retry_attempt_ratio:rate5m
        expr: >-
          impulse:retry_attempts:rate5m
          / clamp_min(impulse:requests:rate5m, 0.000001)

      - record: impulse:retry_denial_ratio:rate5m
        expr: >-
          impulse:retry_denials:rate5m
          / clamp_min(impulse:requests:rate5m, 0.000001)

      - record: impulse:hedge_triggered:rate5m
        expr: >-
          rate(impulse_hedge_triggered_total[5m])

      - record: impulse:hedge_won:rate5m
        expr: >-
          rate(impulse_hedge_won_total[5m])

      - record: impulse:hedge_wasted:rate5m
        expr: >-
          rate(impulse_hedge_wasted_total[5m])

      - record: impulse:hedge_primary_won_after_trigger:rate5m
        expr: >-
          rate(impulse_hedge_primary_won_after_trigger_total[5m])

      - record: impulse:hedge_primary_late_samples:rate5m
        expr: >-
          rate(impulse_hedge_primary_late_samples_total[5m])

      - record: impulse:hedge_primary_late_avg_ms:5m
        expr: >-
          rate(impulse_hedge_primary_late_ms_total[5m])
          / clamp_min(impulse:hedge_primary_late_samples:rate5m, 0.000001)

      - record: impulse:hedge_trigger_ratio:rate5m
        expr: >-
          impulse:hedge_triggered:rate5m
          / clamp_min(impulse:requests:rate5m, 0.000001)

      - record: impulse:hedge_win_ratio:rate5m
        expr: >-
          impulse:hedge_won:rate5m
          / clamp_min(impulse:hedge_triggered:rate5m, 0.000001)

      - record: impulse:hedge_waste_ratio:rate5m
        expr: >-
          impulse:hedge_wasted:rate5m
          / clamp_min(impulse:hedge_triggered:rate5m, 0.000001)

      - record: impulse:external_auth_timeout:rate5m
        expr: >-
          rate(impulse_external_auth_timeout[5m])

      - record: impulse:external_auth_error:rate5m
        expr: >-
          rate(impulse_external_auth_error[5m])

      - record: impulse:external_auth_denials:rate5m
        expr: >-
          rate(impulse_external_auth_denied[5m])

      - record: impulse:external_auth_unavailable:rate5m
        expr: >-
          impulse:external_auth_timeout:rate5m
          + impulse:external_auth_error:rate5m

      - record: impulse:jwt_auth_denials:rate5m
        expr: >-
          sum without (reason)
          (rate(impulse_jwt_validation_failures_total[5m]))

      - record: impulse:jwt_auth_denials_by_reason:rate5m
        expr: >-
          rate(impulse_jwt_validation_failures_total[5m])

      - record: impulse:auth_denials:rate5m
        expr: >-
          impulse:external_auth_denials:rate5m
          + impulse:jwt_auth_denials:rate5m

      - record: impulse:auth_denial_ratio:rate5m
        expr: >-
          impulse:auth_denials:rate5m
          / clamp_min(impulse:requests:rate5m, 0.000001)

      - record: impulse:contract_rejects:rate5m
        expr: >-
          impulse:auth_denials:rate5m
          + rate(impulse_request_rate_limited[5m])
          + sum without (policy, reason, selector_dimensions, backend_mode, decision)
            (rate(impulse_quota_policy_outcomes_total{decision="denied"}[5m]))

      - record: impulse:quota_denials:rate5m
        expr: >-
          sum without (policy, reason, selector_dimensions, backend_mode, decision)
          (rate(impulse_quota_policy_outcomes_total{decision="denied"}[5m]))

      - record: impulse:quota_outcomes_by_decision:rate5m
        expr: >-
          sum without (policy, reason, selector_dimensions, backend_mode)
          (rate(impulse_quota_policy_outcomes_total[5m]))

      - record: impulse:quota_outcomes_by_policy_decision:rate5m
        expr: >-
          sum without (reason, selector_dimensions, backend_mode)
          (rate(impulse_quota_policy_outcomes_total[5m]))

      - record: impulse:quota_denials_by_policy_reason_backend_mode:rate5m
        expr: >-
          sum without (selector_dimensions, decision)
          (rate(impulse_quota_policy_outcomes_total{decision="denied"}[5m]))

      - record: impulse:quota_denial_ratio:rate5m
        expr: >-
          impulse:quota_denials:rate5m
          / clamp_min(impulse:requests:rate5m, 0.000001)

      - record: impulse:contract_reject_ratio:rate5m
        expr: >-
          impulse:contract_rejects:rate5m
          / clamp_min(impulse:requests:rate5m, 0.000001)

      - record: impulse:quota_backend_health_events_by_mode_reason:rate5m
        expr: >-
          rate(impulse_quota_backend_health_total[5m])

      - record: impulse:quota_backend_degraded_events:rate5m
        expr: >-
          sum without (backend_mode, reason)
          (rate(impulse_quota_backend_health_total{reason!="available"}[5m]))

      - record: impulse:tls_handshake_failures:rate5m
        expr: >-
          sum without (listener, reason)
          (rate(impulse_downstream_tls_handshake_failure_total[5m]))

      - record: impulse:tls_handshake_successes:rate5m
        expr: >-
          rate(impulse_downstream_tls_handshake_success_total[5m])

      - record: impulse:tls_handshake_failures_by_listener_reason:rate5m
        expr: >-
          rate(impulse_downstream_tls_handshake_failure_total[5m])

      - record: impulse:tls_certificate_selection_by_listener_selection:rate5m
        expr: >-
          rate(impulse_downstream_tls_certificate_selection_total[5m])

      - record: impulse:tls_alpn_by_listener_protocol:rate5m
        expr: >-
          rate(impulse_downstream_tls_alpn_total[5m])

      - record: impulse:upstream_tls_failures_by_backend_phase_reason:rate5m
        expr: >-
          rate(impulse_upstream_tls_failure_total[5m])

      - record: impulse:upstream_tls_failures_by_backend:rate5m
        expr: >-
          sum by (backend)
          (rate(impulse_upstream_tls_failure_total[5m]))

      - record: impulse:tls_handshake_attempts:rate5m
        expr: >-
          rate(impulse_downstream_tls_handshake_success_total[5m])
          + impulse:tls_handshake_failures:rate5m

      - record: impulse:tls_handshake_failure_ratio:rate5m
        expr: >-
          impulse:tls_handshake_failures:rate5m
          / clamp_min(impulse:tls_handshake_attempts:rate5m, 0.000001)

      - record: impulse:control_api_connection_limit_drops:rate5m
        expr: >-
          rate(impulse_control_api_connection_limit_drops[5m])

      - record: impulse:runtime_validation_attempts:rate5m
        expr: >-
          rate(impulse_runtime_validation_attempts_total[5m])

      - record: impulse:runtime_preview_attempts:rate5m
        expr: >-
          rate(impulse_runtime_preview_attempts_total[5m])

      - record: impulse:runtime_activation_outcomes_by_result_reason:rate5m
        expr: >-
          rate(impulse_runtime_activation_total[5m])

      - record: impulse:runtime_rollback_outcomes_by_result_reason:rate5m
        expr: >-
          rate(impulse_runtime_rollback_total[5m])

      - record: impulse:runtime_change_events:rate5m
        expr: >-
          sum without (result, reason)
          (impulse:runtime_activation_outcomes_by_result_reason:rate5m)
          + sum without (result, reason)
          (impulse:runtime_rollback_outcomes_by_result_reason:rate5m)

      - record: impulse:runtime_rejections_by_reason:rate5m
        expr: >-
          rate(impulse_runtime_rejections_total[5m])

      - record: impulse:watchdog_degraded_windows:rate5m
        expr: >-
          rate(impulse_watchdog_degraded_windows[5m])

      - record: impulse:watchdog_restart_hooks:rate5m
        expr: >-
          rate(impulse_watchdog_restart_hooks[5m])

      - record: impulse:watchdog_restart_requests:rate5m
        expr: >-
          rate(impulse_watchdog_restart_requests[5m])

      - record: impulse:runtime_panics:rate5m
        expr: >-
          rate(impulse_runtime_panics[5m])

      - record: impulse:control_plane_activity_events:rate5m
        expr: >-
          impulse:runtime_validation_attempts:rate5m
          + impulse:runtime_preview_attempts:rate5m
          + sum without (result, reason)
            (impulse:runtime_activation_outcomes_by_result_reason:rate5m)
          + sum without (result, reason)
            (impulse:runtime_rollback_outcomes_by_result_reason:rate5m)
          + sum without (reason)
            (impulse:runtime_rejections_by_reason:rate5m)
          + impulse:watchdog_restart_requests:rate5m
          + impulse:watchdog_restart_hooks:rate5m

      - record: impulse:control_plane_error_events:rate5m
        expr: >-
          impulse:control_api_connection_limit_drops:rate5m
          + impulse:watchdog_degraded_windows:rate5m
          + impulse:runtime_panics:rate5m

      - record: impulse:circuit_breaker_rejected:rate5m
        expr: >-
          rate(impulse_circuit_breaker_rejected_total[5m])

      - record: impulse:request_rate_limited:rate5m
        expr: >-
          rate(impulse_request_rate_limited[5m])

      - record: impulse:backend_dns_refresh_failures:rate5m
        expr: >-
          rate(impulse_backend_dns_refresh_failure_total[5m])

      - record: impulse:backend_dns_refresh_successes:rate5m
        expr: >-
          rate(impulse_backend_dns_refresh_success_total[5m])

      - record: impulse:backend_dns_address_set_changes:rate5m
        expr: >-
          rate(impulse_backend_dns_address_set_changes_total[5m])

      - record: impulse:backend_client_rotation_events:rate5m
        expr: >-
          rate(impulse_backend_client_rotations_total[5m])

      - record: impulse:backend_client_rotation_failures:rate5m
        expr: >-
          rate(impulse_backend_client_rotation_failures_total[5m])

      - record: impulse:backend_client_rotations_by_backend:rate5m
        expr: >-
          rate(impulse_backend_client_rotations[5m])

      - record: impulse:backend_connect_attempts_by_backend:rate5m
        expr: >-
          sum by (backend)
          (rate(impulse_backend_connect_attempt_total[5m]))

      - record: impulse:backend_dns_refresh_failure_ratio:rate5m
        expr: >-
          impulse:backend_dns_refresh_failures:rate5m
          / clamp_min(
            impulse:backend_dns_refresh_failures:rate5m
            + impulse:backend_dns_refresh_successes:rate5m,
            0.000001
          )

      - record: impulse:brownout_active
        expr: >-
          max(impulse_brownout_active)

      - record: impulse:tls_certificate_days_remaining_by_listener_server_name:min
        expr: >-
          min by (listener, server_name)
          (impulse_downstream_tls_certificate_days_remaining)

  - name: impulse-slo-inputs
    interval: 30s
    rules:
      - record: impulse:slo_requests:rate30m
        expr: >-
          sum without (upstream, status_class, outcome)
          (rate(impulse_upstream_requests_total[30m]))

      - record: impulse:slo_request_server_errors:rate30m
        expr: >-
          sum without (upstream, status_class, outcome)
          (rate(impulse_upstream_requests_total{status_class="5xx"}[30m]))

      - record: impulse:slo_request_server_error_ratio:rate30m
        expr: >-
          impulse:slo_request_server_errors:rate30m
          / clamp_min(impulse:slo_requests:rate30m, 0.000001)

      - record: impulse:slo_availability_ratio:30m
        expr: >-
          1 - impulse:slo_request_server_error_ratio:rate30m

      - record: impulse:slo_request_latency_ms:p50_30m
        expr: >-
          histogram_quantile(
            0.50,
            sum without (upstream, outcome)
            (rate(impulse_upstream_request_latency_ms_bucket{outcome="success"}[30m]))
          )

      - record: impulse:slo_request_latency_ms:p95_30m
        expr: >-
          histogram_quantile(
            0.95,
            sum without (upstream, outcome)
            (rate(impulse_upstream_request_latency_ms_bucket{outcome="success"}[30m]))
          )

      - record: impulse:slo_request_latency_ms:p99_30m
        expr: >-
          histogram_quantile(
            0.99,
            sum without (upstream, outcome)
            (rate(impulse_upstream_request_latency_ms_bucket{outcome="success"}[30m]))
          )

      - record: impulse:slo_overload_shed_ratio:30m
        expr: >-
          sum without (reason)
          (rate(impulse_overload_shed_by_reason_total[30m]))
          / clamp_min(impulse:slo_requests:rate30m, 0.000001)

      - record: impulse:slo_backend_timeout_ratio:30m
        expr: >-
          rate(impulse_backend_timeouts[30m])
          / clamp_min(impulse:slo_requests:rate30m, 0.000001)

      - record: impulse:slo_auth_denial_ratio:30m
        expr: >-
          (
            rate(impulse_external_auth_denied[30m])
            + sum without (reason) (rate(impulse_jwt_validation_failures_total[30m]))
          )
          / clamp_min(impulse:slo_requests:rate30m, 0.000001)

      - record: impulse:slo_quota_denial_ratio:30m
        expr: >-
          sum without (policy, reason, selector_dimensions, backend_mode, decision)
          (rate(impulse_quota_policy_outcomes_total{decision="denied"}[30m]))
          / clamp_min(impulse:slo_requests:rate30m, 0.000001)

      - record: impulse:slo_tls_handshake_failure_ratio:30m
        expr: >-
          sum without (listener, reason)
          (rate(impulse_downstream_tls_handshake_failure_total[30m]))
          / clamp_min(
            rate(impulse_downstream_tls_handshake_success_total[30m])
            + sum without (listener, reason)
              (rate(impulse_downstream_tls_handshake_failure_total[30m])),
            0.000001
          )

      - record: impulse:slo_control_plane_error_events:rate30m
        expr: >-
          rate(impulse_control_api_connection_limit_drops[30m])
          + rate(impulse_watchdog_degraded_windows[30m])
          + rate(impulse_runtime_panics[30m])
